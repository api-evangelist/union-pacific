naftiko: 1.0.0-alpha2
info:
  label: Union Pacific API — Equipment
  description: 'Union Pacific API — Equipment. 1 operations. Lead operation: List Equipment. Self-contained Naftiko capability
    covering one Union Pacific business surface.'
  tags:
  - Union Pacific
  - Equipment
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    UNION_PACIFIC_API_KEY: UNION_PACIFIC_API_KEY
capability:
  consumes:
  - type: http
    namespace: union-pacific-equipment
    baseUri: https://api.up.com
    description: Union Pacific API — Equipment business capability. Self-contained, no shared references.
    resources:
    - name: equipment
      path: /equipment
      operations:
      - name: listequipment
        method: GET
        description: List Equipment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: equipmentType
          in: query
          type: string
          description: Type of rail equipment (e.g., boxcar, flatcar, tank car)
        - name: equipmentNumber
          in: query
          type: string
          description: Specific equipment number to look up
        - name: accountId
          in: query
          type: string
          description: Account identifier
  exposes:
  - type: rest
    namespace: union-pacific-equipment-rest
    port: 8080
    description: REST adapter for Union Pacific API — Equipment. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/equipment
      name: equipment
      description: REST surface for equipment.
      operations:
      - method: GET
        name: listequipment
        description: List Equipment
        call: union-pacific-equipment.listequipment
        with:
          equipmentType: rest.equipmentType
          equipmentNumber: rest.equipmentNumber
          accountId: rest.accountId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: union-pacific-equipment-mcp
    port: 9090
    transport: http
    description: MCP adapter for Union Pacific API — Equipment. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-equipment
      description: List Equipment
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: union-pacific-equipment.listequipment
      with:
        equipmentType: tools.equipmentType
        equipmentNumber: tools.equipmentNumber
        accountId: tools.accountId
      outputParameters:
      - type: object
        mapping: $.
