naftiko: 1.0.0-alpha2
info:
  label: Union Pacific API — Shipment Actions
  description: 'Union Pacific API — Shipment Actions. 3 operations. Lead operation: Cancel Request. Self-contained Naftiko
    capability covering one Union Pacific business surface.'
  tags:
  - Union Pacific
  - Shipment Actions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    UNION_PACIFIC_API_KEY: UNION_PACIFIC_API_KEY
capability:
  consumes:
  - type: http
    namespace: union-pacific-shipment-actions
    baseUri: https://api.up.com
    description: Union Pacific API — Shipment Actions business capability. Self-contained, no shared references.
    resources:
    - name: cancelRequest
      path: /cancelRequest
      operations:
      - name: cancelrequest
        method: POST
        description: Cancel Request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: orderEquipment
      path: /orderEquipment
      operations:
      - name: orderequipment
        method: POST
        description: Order In Equipment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: releaseShipment
      path: /releaseShipment
      operations:
      - name: releaseshipment
        method: POST
        description: Release Shipment Equipment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: union-pacific-shipment-actions-rest
    port: 8080
    description: REST adapter for Union Pacific API — Shipment Actions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/cancelrequest
      name: cancelrequest
      description: REST surface for cancelRequest.
      operations:
      - method: POST
        name: cancelrequest
        description: Cancel Request
        call: union-pacific-shipment-actions.cancelrequest
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/orderequipment
      name: orderequipment
      description: REST surface for orderEquipment.
      operations:
      - method: POST
        name: orderequipment
        description: Order In Equipment
        call: union-pacific-shipment-actions.orderequipment
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/releaseshipment
      name: releaseshipment
      description: REST surface for releaseShipment.
      operations:
      - method: POST
        name: releaseshipment
        description: Release Shipment Equipment
        call: union-pacific-shipment-actions.releaseshipment
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: union-pacific-shipment-actions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Union Pacific API — Shipment Actions. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: cancel-request
      description: Cancel Request
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: union-pacific-shipment-actions.cancelrequest
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: order-equipment
      description: Order In Equipment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: union-pacific-shipment-actions.orderequipment
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: release-shipment-equipment
      description: Release Shipment Equipment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: union-pacific-shipment-actions.releaseshipment
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
