description: Union Pacific does not expose a metered API billing model. API usage is bundled with
  the freight customer relationship; FinOps spend is dominated by freight commercial terms, not
  API metering.
sources:
  - https://www.up.com/customers/index.htm
notes: No public usage-based API billing exists. This artifact captures the contractual surface only;
  consumers should treat API access as part of the freight commercial relationship with Union Pacific.
