meters:
  - name: contract
    description: API access bundled into the underlying freight customer contract.
    unit: varies
    aggregation: sum
principles:
  - name: Visibility
    description: API consumption is not separately metered. Track API call volume internally for
      operational health rather than direct cost.
  - name: Allocation
    description: Allocate API integration cost to the freight customer cost center, since access
      is bundled with shipping commercial terms.
  - name: Optimization
    description: Optimize API call volume against the underlying business throughput (shipments,
      waybills) rather than per-call pricing.
  - name: Accountability
    description: Assign ownership to the team managing the Union Pacific commercial relationship;
      API usage anomalies signal operational, not financial, issues.
